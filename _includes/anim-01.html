<script>
  // ── Shared color helpers (used by hover + arrow IIFEs) ────────────
  function _rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r,g,b), min = Math.min(r,g,b);
    var h = 0, s = 0, l = (max + min) / 2;
    if (max !== min) {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch(max) {
        case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
        case g: h = ((b - r) / d + 2) / 6; break;
        case b: h = ((r - g) / d + 4) / 6; break;
      }
    }
    return [h * 360, s * 100, l * 100];
  }

  function _tileBodyBg(tile) {
    var m = getComputedStyle(tile).backgroundColor.match(/\d+/g);
    if (!m) return null;
    var hsl = _rgbToHsl(+m[0], +m[1], +m[2]);
    return 'hsl(' + hsl[0].toFixed(0) + ',' + Math.min(hsl[1] * 0.55, 30).toFixed(0) + '%,78%)';
  }

  function _applyTileBg(tile) {
    var bg = _tileBodyBg(tile);
    if (bg) {
      document.body.style.backgroundColor = bg;
      document.body.classList.add('tile-hover');
      document.body.classList.remove('bg-dark');
    }
  }

  function _applyActiveTileBg() {
    var active = document.querySelector('.hero-tile.is-active');
    if (active) _applyTileBg(active);
  }

  // ── IntersectionObserver: greyscale reveal on touch devices ──
  // root: the scroll row, so intersection is measured within the horizontal
  // container (tiles off to the side = 0%, centered tile = ~100%).
  (function() {
    var row = document.getElementById('tile-scroll-row');
    if (!row) return;
    if (window.matchMedia('(hover: hover)').matches) return;
    var tiles = row.querySelectorAll('.hero-tile');
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        entry.target.classList.toggle('in-view', entry.isIntersecting);
      });
    }, { root: row, threshold: 0.5 });
    tiles.forEach(function(tile) { observer.observe(tile); });
  })();

  // ── CSS animation restart: clone .css-anim after the scroll settles ──
  // iOS WebKit suspends @keyframes on tiles that were offscreen inside the
  // scroll row, and the inline animationName-reset trick fails when it runs
  // mid-snap (IO at threshold 0.9 fires while momentum is still going).
  // Debouncing past the last scroll event waits until the tile has settled
  // onscreen; swapping in a deep clone hands WebKit brand-new nodes, which
  // always start their animations from t=0 -- there is no suspended state
  // for it to fail to resume.
  (function() {
    var row = document.getElementById('tile-scroll-row');
    if (!row) return;
    var tiles = Array.from(row.querySelectorAll('.hero-tile'));
    var lastIdx = -1, timer = null;

    function restartCentered() {
      var center = row.scrollLeft + row.clientWidth / 2;
      var idx = 0, minDist = Infinity;
      tiles.forEach(function(tile, i) {
        var dist = Math.abs((tile.offsetLeft + tile.offsetWidth / 2) - center);
        if (dist < minDist) { minDist = dist; idx = i; }
      });
      if (idx === lastIdx) return;
      lastIdx = idx;
      var anim = tiles[idx].querySelector('.css-anim');
      // Recruiting tile is JS-driven -- its timers hold references into the
      // SVG, so cloning would freeze it.
      if (!anim || anim.querySelector('#rec-grid')) return;
      anim.parentNode.replaceChild(anim.cloneNode(true), anim);
    }

    row.addEventListener('scroll', function() {
      clearTimeout(timer);
      timer = setTimeout(restartCentered, 160);
    });
    timer = setTimeout(restartCentered, 300); // page may load scrolled mid-row
  })();

  // ── Drag-to-scroll ───────────────────────────────────────────────
  (function() {
    var row = document.getElementById('tile-scroll-row');
    if (!row) return;
    var isDown = false, startX, scrollLeft, moved;

    row.addEventListener('mouseenter', function() {
      if (window._setCursorLock) window._setCursorLock('grab');
    });
    row.addEventListener('mouseleave', function() {
      if (!isDown && window._setCursorLock) window._setCursorLock(null);
    });
    row.addEventListener('mousedown', function(e) {
      isDown = true; moved = false;
      row.classList.add('dragging');
      row.style.scrollSnapType = 'none';
      startX = e.pageX;
      scrollLeft = row.scrollLeft;
      e.preventDefault();
    });
    window.addEventListener('mouseup', function() {
      if (!isDown) return;
      isDown = false;
      row.classList.remove('dragging');
      if (window._setCursorLock) window._setCursorLock(null);
      if (moved) {
        var tiles = Array.from(row.querySelectorAll('.hero-tile'));
        var center = row.scrollLeft + row.clientWidth / 2;
        var nearest = null, minDist = Infinity;
        tiles.forEach(function(tile) {
          var dist = Math.abs((tile.offsetLeft + tile.offsetWidth / 2) - center);
          if (dist < minDist) { minDist = dist; nearest = tile; }
        });
        if (nearest) nearest.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        setTimeout(function() { row.style.scrollSnapType = ''; }, 600);
      } else {
        row.style.scrollSnapType = '';
      }
    });
    document.addEventListener('mousemove', function(e) {
      if (!isDown) return;
      var walk = e.pageX - startX;
      if (Math.abs(walk) > 5) {
        moved = true;
        if (window._setCursorLock) window._setCursorLock('grabbing');
      }
      row.scrollLeft = scrollLeft - walk;
    });
    row.addEventListener('click', function(e) {
      if (moved) { e.preventDefault(); e.stopPropagation(); }
    }, true);
  })();

  // ── Hover shadow ─────────────────────────────────────────────────
  (function() {
    if (!window.matchMedia('(hover: hover)').matches) return;
    var tiles = document.querySelectorAll('.hero-tile');
    var shadowEl = document.createElement('div');
    shadowEl.className = 'tile-hover-shadow';
    shadowEl.style.cssText = 'position:fixed;pointer-events:none;border-radius:12px;z-index:9;opacity:0;transition:opacity 0.25s ease;box-shadow:0px 12px 65px rgba(0,0,0,0.32);';
    document.body.appendChild(shadowEl);
    var activeTile = null;
    var rafId = null;

    function syncLoop() {
      if (!activeTile) return;
      var r = activeTile.getBoundingClientRect();
      shadowEl.style.left   = r.left   + 'px';
      shadowEl.style.top    = r.top    + 'px';
      shadowEl.style.width  = r.width  + 'px';
      shadowEl.style.height = r.height + 'px';
      rafId = requestAnimationFrame(syncLoop);
    }

    function stopSync() {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    }

    var row = document.getElementById('tile-scroll-row');
    if (row) row.addEventListener('scroll', function() {
      activeTile = null;
      stopSync();
      shadowEl.style.opacity = '0';
    });

    tiles.forEach(function(tile) {
      tile.addEventListener('mouseenter', function() {
        if (tile.classList.contains('is-active')) return;
        activeTile = tile;
        tile.style.zIndex = '10';
        shadowEl.style.opacity = '1';
        stopSync();
        rafId = requestAnimationFrame(syncLoop);
      });
      tile.addEventListener('mouseleave', function() {
        activeTile = null;
        tile.style.zIndex = '';
        shadowEl.style.opacity = '0';
        stopSync();
      });
    });
  })();

  // ── Background + link color on hover, reverts to active tile ─────
  (function() {
    if (!window.matchMedia('(hover: hover)').matches) return;
    var tiles = document.querySelectorAll('.hero-tile');

    tiles.forEach(function(tile) {
      tile.addEventListener('mouseenter', function() {
        if (!tile.classList.contains('is-active')) _applyTileBg(tile);
      });
      tile.addEventListener('mouseleave', function(e) {
        if (e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.tile-scroll-arrow')) return;
        _applyActiveTileBg();
      });
    });

    document.querySelectorAll('.tile-scroll-arrow').forEach(function(btn) {
      btn.addEventListener('mouseleave', function(e) {
        if (e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.hero-tile')) return;
        _applyActiveTileBg();
      });
    });
  })();

  // ── Scroll arrows + active tile (href management, bg, arrows) ────
  (function() {
    var row = document.getElementById('tile-scroll-row');
    if (!row) return;
    var tiles = Array.from(document.querySelectorAll('.hero-tile'));
    var btnLeft = document.querySelector('.tile-scroll-arrow--left');
    var btnRight = document.querySelector('.tile-scroll-arrow--right');
    if (!btnLeft || !btnRight || tiles.length === 0) return;

    tiles.forEach(function(tile) {
      var href = tile.getAttribute('href');
      if (href) tile.dataset.href = href;
    });

    function getCurrentIndex() {
      var center = row.scrollLeft + row.clientWidth / 2;
      var closest = 0, minDist = Infinity;
      tiles.forEach(function(tile, i) {
        var dist = Math.abs((tile.offsetLeft + tile.offsetWidth / 2) - center);
        if (dist < minDist) { minDist = dist; closest = i; }
      });
      return closest;
    }

    function update() {
      var idx = getCurrentIndex();
      btnLeft.classList.toggle('is-disabled', idx === 0);
      btnRight.classList.toggle('is-disabled', idx === tiles.length - 1);
      tiles.forEach(function(tile, i) {
        var active = i === idx;
        tile.classList.toggle('is-active', active);
        if (tile.dataset.href) {
          if (active) tile.setAttribute('href', tile.dataset.href);
          else tile.removeAttribute('href');
        }
      });
      _applyTileBg(tiles[idx]);
    }

    tiles.forEach(function(tile) {
      tile.addEventListener('click', function() {
        if (!tile.classList.contains('is-active')) {
          tile.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
      });
    });

    btnLeft.addEventListener('click', function() {
      var idx = getCurrentIndex();
      if (idx > 0) tiles[idx - 1].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
    btnRight.addEventListener('click', function() {
      var idx = getCurrentIndex();
      if (idx < tiles.length - 1) tiles[idx + 1].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });

    row.addEventListener('scroll', update);
    update();
  })();

  // ── Recruiting tile grid animation ─────────────────────────────────
  (function() {
    var svg = document.getElementById('rec-grid');
    if (!svg) return;

    var NS = 'http://www.w3.org/2000/svg';
    var SX = 50, SY = 50, STEP = 60;
    var BLUE = '#0071CD';
    var CLR = 'rgba(255,255,255,0.85)';

    // TYPES[col][row]: 0=circle, 1=square, 2=triangle
    // Circles at (0,2),(1,0),(1,3),(2,1),(3,0),(3,3) — no diagonal
    var TYPES = [
      [1, 2, 0, 1],
      [0, 1, 2, 0],
      [2, 0, 1, 2],
      [0, 2, 1, 0]
    ];

    // 5 of 6 circles get checkmarks; unselected: (3,3)
    var CHK = [[0,2],[1,0],[1,3],[2,1],[3,0]];

    var chkIndex = {};
    CHK.forEach(function(t, i) { chkIndex[t[0]+','+t[1]] = i; });

    function mkEl(tag, attrs) {
      var el = document.createElementNS(NS, tag);
      Object.keys(attrs).forEach(function(k) { el.setAttribute(k, attrs[k]); });
      return el;
    }

    var shapes = [];
    var checks = [];

    for (var c = 0; c < 4; c++) {
      for (var r = 0; r < 4; r++) {
        var type = TYPES[c][r];
        var cx = SX + c * STEP, cy = SY + r * STEP;
        var el;

        if (type === 0) {
          el = mkEl('circle', { cx: cx, cy: cy, r: 15, fill: CLR });
        } else if (type === 1) {
          el = mkEl('rect', { x: cx-15, y: cy-15, width: 30, height: 30, rx: 2, fill: CLR });
        } else {
          el = mkEl('polygon', {
            points: cx+','+(cy-15)+' '+(cx-13)+','+(cy+9)+' '+(cx+13)+','+(cy+9),
            fill: CLR
          });
        }

        el.style.opacity = '0';
        el.style.transformBox = 'fill-box';
        el.style.transformOrigin = 'center';
        el.style.transform = 'scale(0)';
        svg.appendChild(el);

        var ki = chkIndex[c+','+r];
        shapes.push({
          el: el, col: c, row: r, cx: cx, cy: cy,
          isChecked: type === 0 && ki !== undefined,
          chkIdx: ki !== undefined ? ki : -1
        });
      }
    }

    // White checkmark path — transform-box set so shrink-to-zero works from center on exit
    CHK.forEach(function(t) {
      var cx = SX + t[0] * STEP, cy = SY + t[1] * STEP;
      var g = mkEl('g', {});
      g.appendChild(mkEl('path', {
        d: 'M'+(cx-5.5)+','+(cy+1)+' L'+(cx-1.5)+','+(cy+5.5)+' L'+(cx+6.5)+','+(cy-4),
        fill: 'none', stroke: 'white', 'stroke-width': '2.5',
        'stroke-linecap': 'round', 'stroke-linejoin': 'round'
      }));
      g.style.opacity = '0';
      g.style.transformBox = 'fill-box';
      g.style.transformOrigin = 'center';
      svg.appendChild(g);
      checks.push({ el: g });
    });

    // Diagonal sweep: col x75 + row x200 -- shapes fill continuously, no row-bursts
    var T0 = 80;
    var COL_STEP = 75;
    var ROW_STEP = 200;

    var shapeTimes = shapes.map(function(s) {
      return T0 + s.col * COL_STEP + s.row * ROW_STEP;
    });

    // Selection order: roughly top-to-bottom across the grid
    var CHK_ORDER = [1, 4, 3, 0, 2]; // indices into CHK array
    var SEL_STEP  = 220;              // ms between each circle being selected

    var LAST_T    = Math.max.apply(null, shapeTimes); // ~905ms
    var GRID_DONE = LAST_T + 380;    // ~1285ms -- full grid pause before selections
    var LAST_SEL  = GRID_DONE + 4 * SEL_STEP; // ~2165ms -- all circles selected
    var FINAL     = LAST_SEL + 1600; // ~3765ms -- extended hold after all circles selected
    var LOOP      = FINAL + 750;     // ~4515ms

    var timers = [];
    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

    function resetAll() {
      timers.forEach(clearTimeout);
      timers = [];
      shapes.forEach(function(s) {
        s.el.style.transition = 'none';
        s.el.style.opacity = '0';
        s.el.style.transform = 'scale(0)';
        s.el.setAttribute('fill', CLR);
      });
      checks.forEach(function(chk) {
        chk.el.style.transition = 'none';
        chk.el.style.opacity = '0';
        chk.el.style.transform = 'scale(1)';
      });
      svg.getBoundingClientRect();
    }

    function runLoop() {
      resetAll();

      // Phase 1: diagonal sweep -- shapes fill in continuously
      shapes.forEach(function(s, i) {
        later(function() {
          s.el.style.transition = 'opacity 0.2s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1)';
          s.el.style.opacity = '1';
          s.el.style.transform = 'scale(1)';
        }, shapeTimes[i]);
      });

      // Phase 2: circles turn blue one by one; all shapes stay visible
      CHK_ORDER.forEach(function(idx, order) {
        var chkPos = CHK[idx];
        later(function() {
          shapes.forEach(function(s) {
            if (s.col === chkPos[0] && s.row === chkPos[1]) {
              s.el.setAttribute('fill', BLUE);
            }
          });
          later(function() {
            checks[idx].el.style.transition = 'opacity 0.18s ease';
            checks[idx].el.style.opacity = '1';
          }, 80);
        }, GRID_DONE + order * SEL_STEP);
      });

      // Phase 3: hold, then everything shrinks to zero together
      later(function() {
        shapes.forEach(function(s) {
          s.el.style.transition = 'transform 0.38s cubic-bezier(0.4,0,0.6,1), opacity 0.28s ease 0.1s';
          s.el.style.transform = 'scale(0)';
          s.el.style.opacity = '0';
        });
        checks.forEach(function(chk) {
          chk.el.style.transition = 'transform 0.38s cubic-bezier(0.4,0,0.6,1), opacity 0.28s ease 0.1s';
          chk.el.style.transform = 'scale(0)';
          chk.el.style.opacity = '0';
        });
      }, FINAL);

      later(runLoop, LOOP);
    }

    runLoop();
  })();
</script>
