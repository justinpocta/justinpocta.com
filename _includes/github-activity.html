<!--
  GitHub Recent Activity Widget
  -----------------------------
  Uses GitHub's public REST API (CORS-enabled, no auth needed for public
  events) -- same client-side-fetch pattern as flickr.html / mastodon.html.
-->

<div class="github-card">
  <div class="github-card-header">
    <svg class="github-icon" width="18" height="18" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/>
    </svg>
    <span class="github-card-label">GitHub</span>
    <span class="github-card-handle">@justinpocta</span>
  </div>
  <div class="github-card-body" id="github-body">
    <p class="github-loading">Loading activity&hellip;</p>
  </div>
</div>

<style>
  .github-card {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    overflow: hidden; border-radius: 10px;
  }
  .github-card-header {
    flex: 0 0 auto;
    padding: 16px 22px 12px;
    border-bottom: 1px solid rgba(0,0,0,0.1);
    display: flex; align-items: center; gap: 7px;
    color: #24292f;
  }
  .github-icon { flex: 0 0 auto; }
  .github-card-label {
    font-weight: 700;
    font-size: 0.95rem;
  }
  .github-card-handle {
    font-weight: 400;
    font-size: 0.85rem;
    color: #888;
  }
  .github-card-body {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
    padding: 24px 22px;
    text-align: center;
  }
  .github-loading { color: #888; font-size: 0.9rem; }
  .github-repo-badge {
    display: inline-block;
    font-size: 0.68em;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #555;
    background: rgba(0,0,0,0.05);
    border-radius: 99px;
    padding: 4px 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .github-commit-msg {
    font-size: 1.1rem;
    line-height: 1.4;
    font-weight: 600;
  }
  .github-commit-date {
    font-size: 0.8rem;
    color: #888;
  }
  @media (prefers-color-scheme: dark) {
    .github-card-header { border-bottom-color: rgba(255,255,255,0.1); color: #e8e8e8; }
    .github-repo-badge { color: #bbb; background: rgba(255,255,255,0.08); }
    .github-commit-date { color: #777; }
    .github-loading { color: #666; }
  }
  :root[data-theme="dark"] .github-card-header { border-bottom-color: rgba(255,255,255,0.1); color: #e8e8e8; }
  :root[data-theme="dark"] .github-repo-badge { color: #bbb; background: rgba(255,255,255,0.08); }
  :root[data-theme="dark"] .github-commit-date { color: #777; }
  :root[data-theme="dark"] .github-loading { color: #666; }
</style>

<script>
(function () {
  var GITHUB_USER = 'justinpocta';

  function timeAgo(dateStr) {
    var diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
    var units = [[31536000, 'y'], [2592000, 'mo'], [86400, 'd'], [3600, 'h'], [60, 'm']];
    for (var i = 0; i < units.length; i++) {
      var v = Math.floor(diff / units[i][0]);
      if (v >= 1) return v + units[i][1] + ' ago';
    }
    return 'just now';
  }

  function escapeHtml(str) {
    return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  var body = document.getElementById('github-body');

  fetch('https://api.github.com/users/' + GITHUB_USER + '/events/public')
    .then(function (res) { return res.json(); })
    .then(function (events) {
      if (!body) return;
      if (!Array.isArray(events)) { body.innerHTML = '<p>Couldn’t load activity.</p>'; return; }

      // The events API no longer includes commit messages in the push
      // payload (just repo/ref/sha) -- fetch the commit itself for that.
      var push = events.find(function (e) { return e.type === 'PushEvent' && e.payload && e.payload.head; });
      if (!push) { body.innerHTML = '<p>No recent public activity.</p>'; return; }

      var repo = push.repo.name;
      var repoShort = repo.split('/')[1] || repo;
      var createdAt = push.created_at;

      fetch('https://api.github.com/repos/' + repo + '/commits/' + push.payload.head)
        .then(function (res) { return res.json(); })
        .then(function (commitData) {
          var msg = commitData.commit ? (commitData.commit.message || '').split('\n')[0] : repoShort;
          body.innerHTML =
            '<span class="github-repo-badge">' + escapeHtml(repoShort) + '</span>' +
            '<span class="github-commit-msg">&ldquo;' + escapeHtml(msg) + '&rdquo;</span>' +
            '<span class="github-commit-date">' + timeAgo(createdAt) + '</span>';
        })
        .catch(function () {
          body.innerHTML =
            '<span class="github-repo-badge">' + escapeHtml(repoShort) + '</span>' +
            '<span class="github-commit-date">' + timeAgo(createdAt) + '</span>';
        });
    })
    .catch(function () {
      if (body) body.innerHTML = '<p>Couldn’t load activity.</p>';
    });
})();
</script>
