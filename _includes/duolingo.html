{% assign duo = site.data.duolingo %}
<div class="duo-card">
  <div class="duo-card-header">
    <span class="duo-owl">&#x1F989;</span>
    <span class="duo-card-label">Duolingo</span>
  </div>
  <div class="duo-card-body">
    <div class="duo-grid">
      <div class="duo-cell duo-cell-avatar">
        {% if duo.picture and duo.picture != "" %}
        <img class="duo-avatar" src="{{ duo.picture }}" alt="{{ duo.username }}">
        {% else %}
        <div class="duo-avatar-placeholder"></div>
        {% endif %}
      </div>
      <div class="duo-cell">
        <span class="duo-stat-label">Language</span>
        <span class="duo-stat-flag">&#x1F1EB;&#x1F1F7;</span>
        <span class="duo-stat-sub">Fran&ccedil;ais</span>
      </div>
      <div class="duo-cell">
        <span class="duo-stat-label">Level</span>
        <span class="duo-stat-num">{{ duo.french_level }}</span>
      </div>
      <div class="duo-cell">
        <span class="duo-stat-label">Day Streak</span>
        <span class="duo-stat-num">{{ duo.streak }}</span>
      </div>
    </div>
    <div class="duo-since">Member since {{ duo.member_since }}</div>
  </div>
</div>

<style>
  .duo-card {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    overflow: hidden; border-radius: 10px;
  }
  .duo-card-header {
    flex: 0 0 auto;
    padding: 16px 22px 12px;
    border-bottom: 1px solid rgba(0,0,0,0.1);
    display: flex; align-items: center; gap: 7px;
  }
  .duo-owl { font-size: 1.05em; line-height: 1; }
  .duo-card-label {
    font-weight: 700;
    font-size: 0.95rem;
  }
  .duo-card-body {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 20px 16px;
    text-align: center;
  }
  /* 2x2 grid: avatar + language on top, level + streak below. Thin
     divider lines come from the grid gap showing through -- cells match
     the card's own background so the seam only reads where the gap is. */
  .duo-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 1px;
    background: rgba(0,0,0,0.08);
    border-radius: 10px;
    overflow: hidden;
    width: 100%;
  }
  .duo-cell {
    background: #fff;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6px;
    padding: 20px 8px;
  }
  .duo-cell-avatar { padding: 16px 8px; }
  .duo-avatar {
    width: 84px; height: 84px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }
  .duo-avatar-placeholder {
    width: 84px; height: 84px;
    border-radius: 50%;
    background: #e8e8e8;
  }
  .duo-since {
    display: inline-block;
    font-size: 0.6em;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #888;
    border: 1px solid rgba(0,0,0,0.15);
    padding: 3px 10px;
    border-radius: 99px;
  }
  .duo-stat-label {
    font-size: 0.62em;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: #aaa;
  }
  .duo-stat-flag {
    font-size: 2.4em;
    line-height: 1;
  }
  .duo-stat-num {
    font-size: 2.6em;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.02em;
  }
.duo-stat-sub {
    font-size: 0.72em;
    color: #888;
    line-height: 1;
  }
  @media (prefers-color-scheme: dark) {
    .duo-card-header { border-bottom-color: rgba(255,255,255,0.1); }
    .duo-grid { background: rgba(255,255,255,0.08); }
    .duo-cell { background: #111; }
    .duo-avatar-placeholder { background: #333; }
    .duo-since { color: #666; border-color: rgba(255,255,255,0.15); }
    .duo-stat-label { color: #555; }
    .duo-stat-sub { color: #666; }
  }
  :root[data-theme="dark"] .duo-card-header { border-bottom-color: rgba(255,255,255,0.1); }
  :root[data-theme="dark"] .duo-grid { background: rgba(255,255,255,0.08); }
  :root[data-theme="dark"] .duo-cell { background: #111; }
  :root[data-theme="dark"] .duo-avatar-placeholder { background: #333; }
  :root[data-theme="dark"] .duo-since { color: #666; border-color: rgba(255,255,255,0.15); }
  :root[data-theme="dark"] .duo-stat-label { color: #555; }
  :root[data-theme="dark"] .duo-stat-sub { color: #666; }
</style>
