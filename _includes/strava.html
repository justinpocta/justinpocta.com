{% assign ride = site.data.strava %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<div class="strava-card">
  <div class="strava-card-header">
    <svg class="strava-icon" width="14" height="20" viewBox="0 0 42 59" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M29.2706 43.5683L24.1528 33.4854L16.5283 33.4982L29.2706 58.4349L41.9999 33.4854H34.3754L29.2706 43.5683Z" fill="#FC5200"/>
      <path d="M17.1812 19.9467L24.1529 33.4852H34.3755L17.1812 0L0 33.4852H10.2356L17.1812 19.9467Z" fill="#FC5200"/>
    </svg>
    <span class="strava-card-label">Latest Ride</span>
  </div>
  <div class="strava-map-wrap">
    <div class="strava-map-div" id="strava-map"></div>
    {% if ride.name == "" %}
    <div class="strava-map-empty">No ride data yet</div>
    {% endif %}
  </div>
  <div class="strava-card-footer">
    <span class="strava-ride-name">{% if ride.name != "" %}{{ ride.name }}{% else %}—{% endif %}</span>
    <span class="strava-ride-meta" id="strava-meta"></span>
  </div>
</div>

<script type="application/json" id="strava-data">{{ ride | jsonify }}</script>

<style>
  .strava-card {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    overflow: hidden; border-radius: 10px;
  }
  .strava-card-header {
    flex: 0 0 auto;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(0,0,0,0.1);
    display: flex; align-items: center; gap: 7px;
  }
  .strava-card-label {
    font-size: 0.72em;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #555;
  }
  .strava-icon { flex: 0 0 auto; }
  .strava-map-wrap {
    flex: 1; min-height: 0;
    position: relative;
  }
  .strava-map-div {
    width: 100%; height: 100%;
  }
  .strava-map-empty {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #556; font-size: 0.85em;
    background: #1a2030;
  }
  .strava-card-footer {
    flex: 0 0 auto;
    padding: 10px 14px 13px;
    border-top: 1px solid rgba(0,0,0,0.1);
    display: flex; flex-direction: column; gap: 3px;
  }
  .strava-ride-name {
    font-weight: 700; font-size: 0.95em; line-height: 1.2;
  }
  .strava-ride-meta {
    font-size: 0.82em; color: #888;
  }
  .strava-map-div .leaflet-control-zoom,
  .strava-map-div .leaflet-control-attribution { display: none !important; }
  .strava-map-div .leaflet-tile { border-radius: 0; overflow: visible; }
  .strava-map-div .leaflet-tile-pane { filter: brightness(0.8) contrast(1.4); }
  @media (prefers-color-scheme: dark) {
    .strava-map-div .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(1.8) contrast(1.2); }
  }
  :root[data-theme="light"] .strava-map-div .leaflet-tile-pane { filter: brightness(0.8) contrast(1.4); }
  :root[data-theme="dark"] .strava-map-div .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(1.8) contrast(1.2); }
  @media (prefers-color-scheme: dark) {
    .strava-card-header { border-bottom-color: rgba(255,255,255,0.1); }
    .strava-card-footer { border-top-color: rgba(255,255,255,0.1); }
    .strava-card-label { color: #bbb; }
    .strava-ride-meta { color: #777; }
  }
  :root[data-theme="dark"] .strava-card-header { border-bottom-color: rgba(255,255,255,0.1); }
  :root[data-theme="dark"] .strava-card-footer { border-top-color: rgba(255,255,255,0.1); }
  :root[data-theme="dark"] .strava-card-label { color: #bbb; }
  :root[data-theme="dark"] .strava-ride-meta { color: #777; }
</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var raw = document.getElementById('strava-data');
  if (!raw) return;
  var ride;
  try { ride = JSON.parse(raw.textContent); } catch (e) { return; }
  if (!ride || !ride.name) return;

  var meta = document.getElementById('strava-meta');
  if (meta) {
    var mi = (ride.distance / 1609.34).toFixed(1) + ' mi';
    var s = ride.moving_time;
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var time = h > 0 ? h + 'h ' + m + 'm' : m + ' min';
    var date = ride.start_date ? new Date(ride.start_date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
    meta.textContent = [date, mi, time].filter(Boolean).join(' · ');
  }

  if (!ride.map_polyline) return;

  function decodePolyline(enc) {
    var pts = [], i = 0, lat = 0, lng = 0;
    while (i < enc.length) {
      var b, shift = 0, result = 0;
      do { b = enc.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      lat += (result & 1) ? ~(result >> 1) : (result >> 1);
      shift = result = 0;
      do { b = enc.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      lng += (result & 1) ? ~(result >> 1) : (result >> 1);
      pts.push([lat / 1e5, lng / 1e5]);
    }
    return pts;
  }

  function initMap() {
    var pts = decodePolyline(ride.map_polyline);
    if (pts.length < 2) return;

    var map = L.map('strava-map', {
      zoomControl: false,
      dragging: false,
      touchZoom: false,
      doubleClickZoom: false,
      scrollWheelZoom: false,
      boxZoom: false,
      keyboard: false,
      attributionControl: false,
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
      subdomains: 'abcd',
      maxZoom: 20,
    }).addTo(map);

    var route = L.polyline(pts, { color: '#FC4C02', weight: 3, opacity: 1 }).addTo(map);
    map.fitBounds(route.getBounds(), { padding: [10, 10] });

    L.circleMarker(pts[0], {
      radius: 5, fillColor: '#FC4C02',
      color: '#fff', weight: 2, fillOpacity: 1,
    }).addTo(map);
  }

  var mapDiv = document.getElementById('strava-map');
  if (mapDiv.offsetHeight > 0) {
    initMap();
  } else {
    var ro = new ResizeObserver(function () {
      if (mapDiv.offsetHeight > 0) { ro.disconnect(); initMap(); }
    });
    ro.observe(mapDiv);
  }
})();
</script>
