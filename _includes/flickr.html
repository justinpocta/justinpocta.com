<!--
  Flickr Recent Photos Widget
  ---------------------------
  Uses Flickr's public JSONP endpoint -- no server/proxy needed, no API secret
  required (that's only for signed/write calls, which this isn't).
-->

<div class="flickr-card social-post">
  <div id="flickr-grid" class="flickr-grid">
    <p class="flickr-loading">Loading photos&hellip;</p>
  </div>
  <div class="flickr-footer">
    <svg class="flickr-icon-svg" width="34" height="16" viewBox="0 0 34 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="8" cy="8" r="8" fill="#FF0084"/>
      <circle cx="26" cy="8" r="8" fill="#0063DC"/>
    </svg>
    <a href="http://photos.justinpocta.com" class="flickr-handle" target="_blank" rel="noopener">@justinpocta</a>
  </div>
</div>

<style>
  .flickr-card {
    max-width: 500px;
    margin: 1.5rem 0;
    font-family: inherit;
    display: block;
  }
  .flickr-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 10px 10px 6px;
  }
  .flickr-grid a {
    display: block;
    overflow: hidden;
    border-radius: 6px;
    aspect-ratio: 1 / 1;
  }
  .flickr-grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.25s ease;
  }
  .flickr-grid a:hover img {
    transform: scale(1.05);
  }
  .flickr-loading {
    color: #888;
    font-size: 0.9rem;
  }
  .flickr-footer {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    padding: 12px 14px 4px;
    border-top: 1px solid #eee;
  }
  .flickr-icon-svg {
    flex: 0 0 auto;
    display: block;
  }
  .flickr-handle {
    font-weight: 600;
    font-size: 0.95rem;
    color: inherit;
    text-decoration: none;
  }
  .flickr-handle:hover {
    text-decoration: underline;
  }
</style>

<script>
(function () {
  var FLICKR_API_KEY = "10603b12c8391b253b19e8f4e01a42b8";
  var FLICKR_USER_ID  = "59585990@N00";
  var PHOTO_COUNT     = 18;

  window.jsonFlickrApi = function (data) {
    var container = document.getElementById("flickr-grid");
    container.innerHTML = "";

    if (data.stat !== "ok") {
      container.innerHTML = "<p>Couldn't load photos right now.</p>";
      return;
    }

    data.photos.photo.forEach(function (p) {
      var thumbUrl = "https://live.staticflickr.com/" + p.server + "/" + p.id + "_" + p.secret + "_q.jpg";
      var pageUrl  = "https://www.flickr.com/photos/" + FLICKR_USER_ID + "/" + p.id;

      var link = document.createElement("a");
      link.href = pageUrl;
      link.target = "_blank";
      link.rel = "noopener";

      var img = document.createElement("img");
      img.src = thumbUrl;
      img.alt = p.title || "Flickr photo";
      img.loading = "lazy";

      link.appendChild(img);
      container.appendChild(link);
    });
  };

  var script = document.createElement("script");
  script.src = "https://api.flickr.com/services/rest/?method=flickr.people.getPublicPhotos"
    + "&api_key=" + FLICKR_API_KEY
    + "&user_id=" + FLICKR_USER_ID
    + "&per_page=" + PHOTO_COUNT
    + "&format=json"
    + "&jsoncallback=jsonFlickrApi";
  document.body.appendChild(script);
})();
</script>
